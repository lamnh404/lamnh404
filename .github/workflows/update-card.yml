name: Update profile card

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/generate.py"]

permissions:
  contents: write

concurrency:
  group: update-card
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- '*.svg'; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "chore: refresh profile card"
          git push
